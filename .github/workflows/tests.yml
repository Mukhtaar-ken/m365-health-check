name: Tests

# When to run: on every pull request, and whenever main changes.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  pester:
    runs-on: windows-latest
    steps:
      # Download the repo's code onto GitHub's machine.
      - uses: actions/checkout@v7

      # Install Pester and run every test in the tests folder.
      # -CI makes the job fail if any test fails.
      - name: Run Pester tests
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Invoke-Pester ./tests -Output Detailed -CI
